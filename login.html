<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AquaBasket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="auth">
    <div class="auth-shell">
      <div class="water water-a"></div>
      <div class="water water-b"></div>
      <section class="auth-card glass-card">
        <a class="back-link" href="index.html">Back to shop</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Login to AquaBasket</h1>
        <p class="auth-copy">Track your favorites, cart picks and fresh arrivals in a smooth storefront flow.</p>

        <form id="loginForm" class="auth-form">
          <label>
            Email
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" id="loginPassword" placeholder="Enter your password" required />
          </label>
          <button class="primary-btn wide" type="submit">Login</button>
        </form>

        <p class="auth-switch">
          Need an account?
          <a href="signup.html">Create one</a>
        </p>
        <p class="auth-message" id="loginMessage"></p>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stationery Shop</title>
  <link rel="stylesheet" href="stationery.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <h2>✏️ Stationery Hub</h2>
  <input type="text" placeholder="Search for products...">
</header>

<!-- MAIN SECTION -->
<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Categories</h3>
    <ul>
      <li>All Products</li>
      <li>Pencils</li>
      <li>Pens</li>
      <li>Notebooks</li>
      <li>Erasers</li>
    </ul>
  </aside>

  <!-- PRODUCTS -->
  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1588776814546-1ffcf47267a5">
      <h4>Pencil Pack</h4>
      <p class="price">₹120 <span>₹200</span></p>
      <button>Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1588771930293-4c9e8b2b4b4d">
      <h4>Color Pencils</h4>
      <p class="price">₹180 <span>₹250</span></p>
      <button>Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1588776814343-1b58e1c68a42">
      <h4>Notebook</h4>
      <p class="price">₹90 <span>₹150</span></p>
      <button>Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1588776814547-1ffcf47267a5">
      <h4>Eraser</h4>
      <p class="price">₹40 <span>₹80</span></p>
      <button>Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1598033129183-c4f50c736f10">
      <h4>Pen Set</h4>
      <p class="price">₹150 <span>₹220</span></p>
      <button>Add</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1603575448364-58d0bff5f2f7">
      <h4>Stationery Kit</h4>
      <p class="price">₹299 <span>₹499</span></p>
      <button>Add</button>
    </div>

  </section>

</div>

</body>
</html>
